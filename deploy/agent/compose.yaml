services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes_agent
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_UID: "${AGENT_UID}"
      HERMES_GID: "${AGENT_GID}"
    volumes:
      - /home/agent/.hermes:/opt/data
    networks: [agent]
    security_opt:
      - no-new-privileges:true
    cpus: 0.8
    mem_limit: 700m
    memswap_limit: 1400m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  agent:
    driver_opts:
      com.docker.network.bridge.name: br-agent
