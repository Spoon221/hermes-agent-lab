# agent.simakov.space - страница Задания 2 (статика из /var/www/diplom/agent, её выкладывает CI).
# HTTPS добавляет certbot: certbot --nginx -d agent.simakov.space --redirect
server {
    listen 80;
    listen [::]:80;
    server_name agent.simakov.space;

    root /var/www/diplom/agent;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_static on;
    gzip_vary on;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
